# goreleaser configuration — builds cross-platform binaries + checksums and
# attaches them to the GitHub Release on each pushed tag.
version: 2

project_name: offload-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: offload
    main: .
    binary: offload
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/offloadsecurity/offload-cli/internal/cli.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: offloadsecurity
    name: offload-cli
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
