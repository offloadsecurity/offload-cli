name: "Offload Security Scan"
description: "Scan a repository for secrets, vulnerable dependencies, and IaC misconfigurations — open-source, powered by Offload Security."
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Directory to scan"
    required: false
    default: "."
  scanners:
    description: "Comma-separated scanners: secrets,sbom,sca,iac"
    required: false
    default: "secrets,sbom,sca,iac"
  fail-on:
    description: "Fail the job if a finding is at or above this severity (critical|high|medium|low). Empty = never fail."
    required: false
    default: "high"
  format:
    description: "Output format written to the log: table | json | sarif"
    required: false
    default: "table"
  sarif-file:
    description: "If set, also write SARIF to this path (upload it with github/codeql-action/upload-sarif)."
    required: false
    default: ""
  cli-version:
    description: >-
      offload-cli release to download (e.g. v0.2.0). Defaults to the action ref
      when that is a release tag. Set it when you pin the action to a commit SHA
      and want the prebuilt binary instead of a source build.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install offload-cli and pinned scanners
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        IN_CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}" in
          Linux|macOS) ;;
          *) echo "::error::offload-cli action supports Linux and macOS runners (got ${RUNNER_OS})"; exit 1 ;;
        esac
        bin="${RUNNER_TEMP}/offload-cli/bin"
        mkdir -p "$bin"
        echo "$bin" >> "$GITHUB_PATH"

        # Scanners: versions and checksum pins come from scanners.env at this
        # action ref; every download is verified before use (fail closed).
        sh "$GITHUB_ACTION_PATH/install.sh" --scanners-only \
          --scanners-env "$GITHUB_ACTION_PATH/scanners.env" --bin-dir "$bin"

        # The CLI: prefer the checksum-verified release binary that matches the
        # action ref. github.action_ref can be empty in composite actions, so
        # fall back to the ref directory name under _actions/<owner>/<repo>/<ref>.
        ref="${IN_CLI_VERSION:-${ACTION_REF:-$(basename "$GITHUB_ACTION_PATH")}}"
        if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          sh "$GITHUB_ACTION_PATH/install.sh" --version "$ref" --bin-dir "$bin"
        elif command -v go >/dev/null 2>&1; then
          echo "::notice::Action ref '${ref}' is not a release tag, so there is no prebuilt binary to download. Building offload-cli from the action source with $(go version)."
          ( cd "$GITHUB_ACTION_PATH" && CGO_ENABLED=0 go build -trimpath -o "$bin/offload" . )
        else
          echo "::error::Action ref '${ref}' is not a release tag (vX.Y.Z), so there is no prebuilt binary, and Go is not installed to build from source. Pin a release tag (offloadsecurity/offload-cli@v0.2.0), set the cli-version input, or add actions/setup-go before this step."
          exit 1
        fi
        "$bin/offload" version

    - name: Run Offload scan
      shell: bash
      env:
        IN_PATH: ${{ inputs.path }}
        IN_SCANNERS: ${{ inputs.scanners }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_FORMAT: ${{ inputs.format }}
        IN_SARIF: ${{ inputs.sarif-file }}
      run: |
        set -euo pipefail
        # Write SARIF first: the gated run below exits 3 when fail-on is hit,
        # and the SARIF file must still exist for upload-sarif (if: always()).
        if [ -n "$IN_SARIF" ]; then
          offload scan "$IN_PATH" --scanners "$IN_SCANNERS" --format sarif --output "$IN_SARIF"
        fi
        args=(scan "$IN_PATH" --scanners "$IN_SCANNERS" --format "$IN_FORMAT")
        if [ -n "$IN_FAIL_ON" ]; then args+=(--fail-on "$IN_FAIL_ON"); fi
        offload "${args[@]}"
